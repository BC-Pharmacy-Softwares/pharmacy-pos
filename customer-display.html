<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Display</title>
  <style>
    :root {
      --primary: #0d6efd;
      --success: #198754;
      --surface: #f8f9fa;
      --surface2: #e9ecef;
      --border: #dee2e6;
      --text: #212529;
      --text-muted: #6c757d;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1b2a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #0a1628;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .header-brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .header-tagline {
      font-size: 13px;
      color: rgba(255,255,255,.5);
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .idle-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: rgba(255,255,255,.4);
      font-size: 15px;
    }
    .idle-screen .icon {
      font-size: 64px;
      opacity: .3;
    }
    .cart-section { display: none; flex-direction: column; gap: 12px; }
    .cart-section.active { display: flex; }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 4px;
    }
    .item-list { display: flex; flex-direction: column; gap: 6px; }
    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255,255,255,.06);
      border-radius: var(--radius);
    }
    .item-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(13,110,253,.5);
      letter-spacing: .5px;
    }
    .item-badge.rx { background: rgba(102,16,242,.5); }
    .item-badge.otc { background: rgba(13,110,253,.5); }
    .item-badge.custom { background: rgba(32,201,151,.5); }
    .item-name { flex: 1; font-size: 14px; font-weight: 500; }
    .item-price { font-size: 15px; font-weight: 700; color: rgba(255,255,255,.9); }
    .totals-card {
      background: rgba(255,255,255,.08);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .totals-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: rgba(255,255,255,.7);
    }
    .totals-row.total-row {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.15);
      margin-top: 4px;
    }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: .6; }
    }
    .footer {
      text-align: center;
      padding: 12px;
      font-size: 12px;
      color: rgba(255,255,255,.2);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #6c757d;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.connected { background: #198754; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="header-brand">&#9654; Pharmacy</div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:12px;color:rgba(255,255,255,.4);">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Waiting for POS...</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="idle-screen" id="idle-screen">
      <div class="icon">&#128164;</div>
      <div>Welcome! Your items will appear here.</div>
    </div>

    <div class="cart-section" id="cart-section">
      <div>
        <div class="section-label">Your Items</div>
        <div class="item-list" id="item-list"></div>
      </div>
      <div class="totals-card" id="totals-card"></div>
    </div>
  </div>

  <div class="footer" id="footer-date"></div>

  <script>
    const fmtMoney = n => '$' + (n || 0).toFixed(2);

    const idleEl   = document.getElementById('idle-screen');
    const cartEl   = document.getElementById('cart-section');
    const itemList = document.getElementById('item-list');
    const totalsCard = document.getElementById('totals-card');
    const statusDot  = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    document.getElementById('footer-date').textContent =
      new Date().toLocaleDateString('en-CA', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

    function showCart(items, totals) {
      idleEl.style.display = 'none';
      cartEl.classList.add('active');

      itemList.innerHTML = items.map(item => {
        const badgeClass = (item.item_type||'').toLowerCase();
        return `<div class="item-row">
          <span class="item-badge ${badgeClass}">${item.item_type||'—'}</span>
          <span class="item-name">${item.description}</span>
          ${item.quantity > 1 ? `<span style="font-size:13px;color:rgba(255,255,255,.5);">×${item.quantity}</span>` : ''}
          <span class="item-price">${fmtMoney(item.line_total)}</span>
        </div>`;
      }).join('');

      const gstRate = totals.gst_amount > 0 ? '' : '';
      totalsCard.innerHTML = `
        <div class="totals-row"><span>Subtotal</span><span>${fmtMoney(totals.subtotal)}</span></div>
        ${totals.gst_amount > 0 ? `<div class="totals-row"><span>GST</span><span>${fmtMoney(totals.gst_amount)}</span></div>` : ''}
        ${totals.pst_amount > 0 ? `<div class="totals-row"><span>PST</span><span>${fmtMoney(totals.pst_amount)}</span></div>` : ''}
        <div class="totals-row total-row">
          <span>TOTAL</span>
          <span class="pulse">${fmtMoney(totals.total_amount)}</span>
        </div>`;
    }

    function showIdle() {
      cartEl.classList.remove('active');
      idleEl.style.display = '';
    }

    try {
      const bc = new BroadcastChannel('pos-cart');
      bc.addEventListener('message', e => {
        statusDot.classList.add('connected');
        statusText.textContent = 'Connected';
        if (e.data.type === 'cart') {
          showCart(e.data.items, e.data.totals);
        } else if (e.data.type === 'clear') {
          showIdle();
        }
      });
    } catch(err) {
      statusText.textContent = 'BroadcastChannel not available';
    }
  </script>
</body>
</html>
